name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install schema compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-bin

      - name: Package extension
        id: package
        run: |
          UUID="clipboard-khipu@ruddyquispe.github.io"
          bash scripts/stage-package.sh "package/$UUID"
          ZIP_NAME="clipboard-khipu-${GITHUB_REF_NAME}.zip"
          (cd package && zip -qr "../$ZIP_NAME" "$UUID")
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.package.outputs.zip_name }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
